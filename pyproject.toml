[project]
name = "mogakco-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "cryptography>=44",
    "fastapi[standard]>=0.115",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
