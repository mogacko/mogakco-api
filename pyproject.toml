[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mogakco-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]